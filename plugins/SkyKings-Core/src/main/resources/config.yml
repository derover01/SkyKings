# SkyKings-Core Konfiguration (Phase 1A)
#
# WICHTIG (siehe CLAUDE.md Punkt 5): Diese Vorlage darf niemals echte Zugangsdaten
# enthalten. Die generierte Laufzeitversion liegt unter
# server/plugins/SkyKings-Core/config.yml und ist per .gitignore von Git ausgeschlossen.

debug: false

resource-pack:
  # Das finale 1.8.9-Pack liegt unter einer stabilen direkten HTTPS-URL im oeffentlichen Repo.
  # enabled bleibt bis zum echten 1.8.9-Clienttest bewusst false. Ohne aktivierten Pack
  # bleibt der komplette Server weiterhin spielbar.
  enabled: false
  send-on-join: true
  join-delay-ticks: 40
  url: "https://raw.githubusercontent.com/derover01/SkyKings/main/dist/SkyKings-ResourcePack-1.8.9.zip"

storage:
  # SQLITE ist in Phase 1A implementiert und Standard fuer die lokale Entwicklung.
  # MYSQL ist als Zielarchitektur vorbereitet (siehe DataStore-Interface), aber noch
  # NICHT implementiert - siehe Abschlussbericht "offene Punkte".
  type: SQLITE

  sqlite:
    file: skykings-core.db

  mysql:
    host: localhost
    port: 3306
    database: skykings
    username: skykings
    password: ""
    useSSL: false
