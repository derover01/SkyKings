name: SkyKings-Core
version: ${project.version}
main: net.skykings.core.SkyKingsCore
description: >
  Zentrales SkyKings-Modul für Player-Profile, Ränge, Economy, Cooldowns, Rank-Kits,
  Persistenz, Islands, Plots und gemeinsame APIs für andere SkyKings-Module.
authors: [SkyKings Team]
commands:
  commands:
    description: Öffnet die zentrale SkyKings-Befehlsübersicht.
    usage: /commands
    aliases: [befehle, cmds]
  kit:
    description: Zeigt verfügbare Rank-Kits oder gibt ein Kit aus.
    usage: /kit [name]
    aliases: [kits]
  rankup:
    description: Kauft den nächsten Free-Rang mit Coins.
    usage: /rankup
    aliases: [rangup]
  raenge:
    description: Öffnet die Rang-Übersicht.
    usage: /raenge
    aliases: [ränge, ranks, rang]
  fly:
    description: Schaltet den Flugmodus für Knight+ um.
    usage: /fly
  speed:
    description: Stellt die persönliche Fluggeschwindigkeit ein.
    usage: /speed <1-10|reset>
  stack:
    description: Verdichtet stackbare Inventar-Items für Knight+.
    usage: /stack
  bloecke:
    description: Öffnet unbegrenzte No-Sell-Baublöcke für Phoenix+.
    usage: /bloecke
    aliases: [blöcke, blocks]
  repair:
    description: Repariert das gehaltene Item für Exile+.
    usage: /repair
  enderchest:
    description: Öffnet die eigene mehrseitige Enderchest für Gold+.
    usage: /enderchest
    aliases: [ec]
  anvil:
    description: Öffnet einen portablen Amboss.
    usage: /anvil
    aliases: [amboss]
  workbench:
    description: Öffnet eine portable Werkbank.
    usage: /workbench
    aliases: [wb, craft]
  enchantmenttable:
    description: Öffnet einen portablen Verzauberungstisch.
    usage: /enchantmenttable
    aliases: [etable, enchanting]
  buildmode:
    description: Aktiviert/deaktiviert den Staff-Baumodus auf geschützten Maps.
    usage: /buildmode
    aliases: [bm]
  trade:
    description: Sicherer Zwei-Spieler-Handel mit Items und Coins.
    usage: /trade <Spieler|accept|deny>
    aliases: [handel]
  shop:
    description: Öffnet den zentralen SkyKings-Systemshop.
    usage: /shop
    aliases: [markt]
  worth:
    description: Zeigt den Systemshop-Verkaufswert des gehaltenen Items.
    usage: /worth
    aliases: [wert]
  sell:
    description: Verkauft whitelisted Items an den Systemshop.
    usage: /sell <hand|all>
    aliases: [verkaufen]
  shopnpc:
    description: Bindet Villager persistent an SkyKings-Shops.
    usage: /shopnpc <bind|unbind|info> [system|pvp|blacksmith|enchant|recycler|merchant|jackpot]
  island:
    description: Private SkyKings-Islands mit Trust-, Welcome- und Schutzsystem.
    usage: /is [menu|create|home|sethome|trust|untrust|visit|info]
    aliases: [is]
  plot:
    description: PlotSquared-inspirierte private SkyKings-Plots.
    usage: /plot [menu|auto|home|sethome|trust|untrust|visit|info]
    aliases: [p, plots]
  clan:
    description: Erstellt und verwaltet deinen SkyKings-Clan.
    usage: /clan [create|invite|accept|leave|kick|disband|info]
    aliases: [clans, c]
  playershop:
    description: Händler-Ei-basierte Villager-PlayerShops auf eigener Insel oder eigenem Plot.
    usage: /playershop <kaufen|set|stock|withdraw|claim|info|remove>
    aliases: [pshop]
  spawnerstack:
    description: Zeigt die Größe des angesehenen Spawner-Stacks.
    usage: /spawnerstack
    aliases: [spawner, ams]
  dailyrewards:
    description: Holt den täglichen SkyKings-Reward ab.
    usage: /dailyrewards
    aliases: [daily, dailyreward]
  gm:
    description: Staff-Gamemode-Befehl.
    usage: /gm <0|1|2|3> [Spieler]
    aliases: [gamemode]
  trash:
    description: Öffnet ein temporäres Müllinventar.
    usage: /trash
    aliases: [muell, müll]
permissions:
  skykings.admin.commands:
    description: Zeigt den Admin-Bereich im /commands-Menü.
    default: false
  skykings.admin.freesign:
    description: Darf persistente SkyKings-Free-Signs erstellen und entfernen.
    default: false
  skykings.admin.shopnpc:
    description: Darf Villager an SkyKings-Shoptypen binden.
    default: false
  skykings.admin.buildmode:
    description: Darf den Map-Schutz mit /buildmode persönlich umgehen.
    default: false
  skykings.admin.island.bypass:
    description: Darf den Besitzschutz in der privaten Island-Welt umgehen.
    default: false
  skykings.admin.plot.bypass:
    description: Darf den Besitzschutz in der Plot-Welt umgehen.
    default: false
  skykings.admin.claim.bypass:
    description: Darf Claim-Prüfungen für Spawner-Systeme umgehen.
    default: false
  skykings.staff.gamemode:
    description: Darf /gm verwenden.
    default: false
  skykings.perk.speed:
    description: Darf die persönliche Fluggeschwindigkeit mit /speed ändern.
    default: false
  skykings.perk.anvil:
    description: Darf /anvil verwenden.
    default: false
  skykings.perk.workbench:
    description: Darf /workbench verwenden.
    default: false
  skykings.perk.enchantmenttable:
    description: Darf /enchantmenttable verwenden.
    default: false
