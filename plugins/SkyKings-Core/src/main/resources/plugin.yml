name: SkyKings-Core
version: ${project.version}
main: net.skykings.core.SkyKingsCore
description: >
  Zentrales SkyKings-Modul fuer Player-Profile, Raenge, Economy, Cooldowns, Rank-Kits,
  Persistenz und gemeinsame APIs fuer andere SkyKings-Module.
authors: [SkyKings Team]
commands:
  kit:
    description: Zeigt verfuegbare Rank-Kits oder gibt ein Kit aus.
    usage: /kit [name]
    aliases: [kits]
  rankup:
    description: Kauft den naechsten Free-Rang mit Coins.
    usage: /rankup
    aliases: [rangup]
  raenge:
    description: Oeffnet die Rang-Uebersicht.
    usage: /raenge
    aliases: [ränge, ranks, rang]
  fly:
    description: Schaltet den Flugmodus fuer Knight+ um.
    usage: /fly
  stack:
    description: Verdichtet stackbare Inventar-Items fuer Knight+.
    usage: /stack
  bloecke:
    description: Oeffnet unbegrenzte No-Sell-Buildbloecke fuer Phoenix+.
    usage: /bloecke
    aliases: [blöcke, blocks]
  repair:
    description: Repariert das gehaltene Item fuer Exile+.
    usage: /repair
