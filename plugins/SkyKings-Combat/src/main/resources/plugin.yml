name: SkyKings-Combat
version: ${project.version}
main: net.skykings.combat.SkyKingsCombat
depend: [SkyKings-Core]
description: >
  Combat-Modul für klassisches 1.8-SkyPvP, Map-Gameplay, Retention und Community-Systeme.
authors: [SkyKings Team]
commands:
  stats:
    description: Öffnet das einheitliche SkyKings Spielerprofil.
    usage: /stats [Spieler]
    aliases: [pvpstats, profile, profil]
  top:
    description: Öffnet die SkyKings-PvP-Toplisten und das Bounty Board.
    usage: /top
    aliases: [leaderboard, leaderboards, kopfgeld, bounty]
  killeffect:
    description: Öffnet die Auswahl deiner kosmetischen Kill-Effects.
    usage: /killeffect
    aliases: [killeffects, killeffekt]
  collection:
    description: Öffnet deine Head Collection mit bereits besiegten Spielern.
    usage: /collection [Seite]
    aliases: [heads, headcollection, sammlung]
  stattrack:
    description: Öffnet Weapon History und verwaltet StatTrack-Module.
    usage: /stattrack [apply|give]
    aliases: [weaponhistory, weaponstats]
  mapmastery:
    description: Zeigt deine Map-Mastery mit Hot-Zone-, King-, End- und Secret-Fortschritt.
    usage: /mapmastery [Spieler]
    aliases: [mastery, mapstats]
  achievements:
    description: Zeigt deine PvP- und Map-Achievements.
    usage: /achievements
    aliases: [erfolge]
  season:
    description: Zeigt Season-XP und PvP-Level.
    usage: /season
  pvplevel:
    description: Zeigt dein PvP-Level 1-100.
    usage: /pvplevel
    aliases: [level, pvplvl]
  medals:
    description: Öffnet permanente Season- und Combat-Medaillen.
    usage: /medals [Spieler]
    aliases: [medaillen]
  seasonadmin:
    description: Schließt eine Season sicher ab und archiviert Hall-of-Fame und Medaillen.
    usage: /seasonadmin finish
    permission: skykings.admin.season
  legacyhall:
    description: Öffnet die permanente Season Hall of Fame.
    usage: /legacyhall [page|set|remove]
    aliases: [halloffame, hof]
  battlepass:
    description: Öffnet den Season Battle Pass mit Free- und Premium-Track.
    usage: /battlepass [rewards|quests]
    aliases: [bp]
  quests:
    description: Öffnet das Battle-Pass-Quest-Center.
    usage: /quests [daily|weekly|premium]
    aliases: [quest, aufgaben]
  peace:
    description: Gegenseitiges Peace-System für SkyPvP.
    usage: /peace <Spieler|accept|deny|remove|list>
    aliases: [friede, friend]
  duel:
    description: Fordert einen Spieler zu einem sicheren 1v1 mit optionalem Coin-Einsatz heraus.
    usage: /duel <Spieler> [Einsatz|Arena] [Arena]
    aliases: [1v1]
  lms:
    description: Last-Man-Standing Queue und Serverevent.
    usage: /lms <join|leave|start|stop>
    aliases: [lastmanstanding]
  targetevent:
    description: Most-Wanted-Event innerhalb konfigurierter PvP-Regionen.
    usage: /targetevent <status|start|stop> [Spieler]
    aliases: [mostwanted, target]
  verlosung:
    description: Serverweite Coin-Verlosung.
    usage: /verlosung <join|start|stop>
    aliases: [giveaway]
  eventarena:
    description: Richtet persistente Arena-Punkte für Duel, LMS, Tournament und Juggernaut ein.
    usage: /eventarena <set|info|list|remove> [Arena] [Punkt]
    permission: skykings.admin.event
    aliases: [arenasetup, eventsetup]
  mapsetup:
    description: Öffnet die 6x9 Staff-Übersicht für das Map-Setup.
    usage: /mapsetup
    permission: skykings.admin.map
  maploot:
    description: Richtet persistente Map-Loot-Chests ein.
    usage: /maploot <set|remove|refill>
    permission: skykings.admin.map
  supplydrop:
    description: Verwaltet Supply-Drop-Punkte und Drops.
    usage: /supplydrop <addpoint|points|trigger>
    permission: skykings.admin.map
  kingaltar:
    description: Setzt und verwaltet den King Altar / KOTH.
    usage: /kingaltar <set|remove|info> [Radius]
    permission: skykings.admin.map
    aliases: [koth, kingzone]
  hotzone:
    description: Setzt und verwaltet PvP-Hot-Zones.
    usage: /hotzone <add|remove|list> [Name] [Radius]
    permission: skykings.admin.map
    aliases: [hotzones]
  endzone:
    description: Setzt und verwaltet die End-Zone mit eigenen PvP-Rewards.
    usage: /endzone <set|remove|info> [Radius]
    permission: skykings.admin.map
  pvpregion:
    description: Definiert Open-World-PvP-Cuboids für Target- und Map-Events.
    usage: /pvpregion <pos1|pos2|create|remove|list>
    permission: skykings.admin.pvpregion
    aliases: [pvpzone, pvparea]
  secret:
    description: Setzt und verwaltet einmalige Map-Secrets.
    usage: /secret <add|remove|list> [Name] [Radius]
    permission: skykings.admin.map
    aliases: [secrets]
  secretroom:
    description: Bindet versteckte Loot-Truhen mit globalem Respawn-Cooldown.
    usage: /secretroom <add|remove|list>
    permission: skykings.admin.secretroom
    aliases: [secretcache, lootroom]
  route:
    description: Erstellt Jump- und Pearl-Routen mit Checkpoints.
    usage: /route <create|addpoint|remove|list> [Name]
    permission: skykings.admin.map
    aliases: [maproute, pearlroute, jumproute]
  landmark:
    description: Markiert Gold-, Level-, Blacksmith- und Merchant-Islands.
    usage: /landmark <set|remove|list> [Typ] [Radius]
    permission: skykings.admin.map
    aliases: [islandmarker, maplandmark]
  trashbin:
    description: Registriert Hopper als 6x9 Map-Muelleimer.
    usage: /trashbin <add|remove|list>
    permission: skykings.admin.map
    aliases: [maptrash, muelleimer]
  mapdisplay:
    description: Setzt dynamische Map-Hologramme und Leaderboards.
    usage: /mapdisplay <set|remove|list> [topkills|king|hotzones]
    permission: skykings.admin.map
    aliases: [mapholo, maphologram]
  skymap:
    description: Lädt die Produktionsmap oder generiert die Legacy-Testmap.
    usage: /skymap <load|generate> [Weltname]
    permission: skykings.admin.map
  spawn:
    description: Teleportiert dich nach 3 Sekunden zum globalen SkyKings-Spawn.
    usage: /spawn
  setspawn:
    description: Setzt globalen SkyKings-Spawn und Worldspawn.
    usage: /setspawn
    permission: skykings.admin.map
permissions:
  skykings.killeffect.lightning:
    description: Schaltet den Blitz-Kill-Effect frei.
    default: false
  skykings.killeffect.flame:
    description: Schaltet den Flammen-Kill-Effect frei.
    default: false
  skykings.killeffect.heart:
    description: Schaltet den Herz-Kill-Effect frei.
    default: false
  skykings.killeffect.ender:
    description: Schaltet den Ender-Kill-Effect frei.
    default: false
  skykings.admin.map:
    description: Darf Map-Gameplay, Spawn, Zonen, Secrets, Routen, Landmarks, Displays und Map-Import einrichten.
    default: false
  skykings.admin.pvpregion:
    description: Darf PvP-Regionen für Open-World-Events definieren.
    default: false
  skykings.admin.secretroom:
    description: Darf Secret Loot Rooms einrichten und entfernen.
    default: false
  skykings.admin.targetevent:
    description: Darf Most-Wanted-Events starten und stoppen.
    default: false
  skykings.admin.stattrack:
    description: Darf StatTrack-Module ausgeben.
    default: false
  skykings.admin.season:
    description: Darf eine Season abschließen und archivieren.
    default: false
  skykings.admin.legacyhall:
    description: Darf Legacy-Hall-Displays platzieren und entfernen.
    default: false
  skykings.admin.event:
    description: Darf Serverevents und Event-Arenen einrichten, starten und stoppen.
    default: false
  skykings.admin.event.bypass:
    description: Darf Event-Sicherheitsbeschränkungen als Staff umgehen.
    default: false
  skykings.admin.battlepass:
    description: Darf Premium Battle Pass für Spieler aktivieren/deaktivieren.
    default: false
