name: SkyKings-Combat
version: ${project.version}
main: net.skykings.combat.SkyKingsCombat
depend: [SkyKings-Core]
description: >
  Combat-Modul für klassisches 1.8-SkyPvP, Map-Gameplay, Retention und Community-Systeme.
authors: [SkyKings Team]
commands:
  stats:
    description: Zeigt deine oder die PvP-Stats eines Online-Spielers.
    usage: /stats [Spieler]
    aliases: [pvpstats]
  top:
    description: Öffnet die SkyKings-PvP-Toplisten.
    usage: /top
    aliases: [leaderboard, leaderboards]
  killeffect:
    description: Öffnet die Auswahl deiner kosmetischen Kill-Effects.
    usage: /killeffect
    aliases: [killeffects, killeffekt]
  mapmastery:
    description: Zeigt deine Map-Mastery mit Hot-Zone-, King-, End- und Secret-Fortschritt.
    usage: /mapmastery [Spieler]
    aliases: [mastery, mapstats]
  achievements:
    description: Zeigt deine PvP- und Map-Achievements.
    usage: /achievements
    aliases: [achievements, erfolge]
  season:
    description: Zeigt Season-XP und PvP-Level.
    usage: /season
  pvplevel:
    description: Zeigt dein PvP-Level 1-100.
    usage: /pvplevel
    aliases: [level, pvplvl]
  peace:
    description: Gegenseitiges Peace-System für SkyPvP.
    usage: /peace <Spieler|accept|deny|remove|list>
    aliases: [friede, friend]
  verlosung:
    description: Serverweite Coin-Verlosung.
    usage: /verlosung <join|start|stop>
    aliases: [giveaway]
  mapsetup:
    description: Öffnet die 6x9 Staff-Übersicht für das Map-Setup.
    usage: /mapsetup
    permission: skykings.admin.map
  maploot:
    description: Richtet persistente Map-Loot-Chests ein.
    usage: /maploot <set|remove|refill>
    permission: skykings.admin.map
  supplydrop:
    description: Verwaltet Supply-Drop-Punkte und Drops.
    usage: /supplydrop <addpoint|points|trigger>
    permission: skykings.admin.map
  kingaltar:
    description: Setzt und verwaltet den King Altar / KOTH.
    usage: /kingaltar <set|remove|info> [Radius]
    permission: skykings.admin.map
    aliases: [koth, kingzone]
  hotzone:
    description: Setzt und verwaltet PvP-Hot-Zones.
    usage: /hotzone <add|remove|list> [Name] [Radius]
    permission: skykings.admin.map
    aliases: [hotzones]
  endzone:
    description: Setzt und verwaltet die End-Zone mit eigenen PvP-Rewards.
    usage: /endzone <set|remove|info> [Radius]
    permission: skykings.admin.map
  secret:
    description: Setzt und verwaltet einmalige Map-Secrets.
    usage: /secret <add|remove|list> [Name] [Radius]
    permission: skykings.admin.map
    aliases: [secrets]
  route:
    description: Erstellt Jump- und Pearl-Routen mit Checkpoints.
    usage: /route <create|addpoint|remove|list> [Name]
    permission: skykings.admin.map
    aliases: [maproute, pearlroute, jumproute]
  landmark:
    description: Markiert Gold-, Level-, Blacksmith- und Merchant-Islands.
    usage: /landmark <set|remove|list> [Typ] [Radius]
    permission: skykings.admin.map
    aliases: [islandmarker, maplandmark]
  trashbin:
    description: Registriert Hopper als 6x9 Map-Muelleimer.
    usage: /trashbin <add|remove|list>
    permission: skykings.admin.map
    aliases: [maptrash, muelleimer]
  mapdisplay:
    description: Setzt dynamische Map-Hologramme und Leaderboards.
    usage: /mapdisplay <set|remove|list> [topkills|king|hotzones]
    permission: skykings.admin.map
    aliases: [mapholo, maphologram]
  skymap:
    description: Lädt die Produktionsmap oder generiert die Legacy-Testmap.
    usage: /skymap <load|generate> [Weltname]
    permission: skykings.admin.map
  spawn:
    description: Teleportiert dich nach 3 Sekunden zum globalen SkyKings-Spawn.
    usage: /spawn
  setspawn:
    description: Setzt globalen SkyKings-Spawn und Worldspawn.
    usage: /setspawn
    permission: skykings.admin.map
permissions:
  skykings.killeffect.lightning:
    description: Schaltet den Blitz-Kill-Effect frei.
    default: false
  skykings.killeffect.flame:
    description: Schaltet den Flammen-Kill-Effect frei.
    default: false
  skykings.killeffect.heart:
    description: Schaltet den Herz-Kill-Effect frei.
    default: false
  skykings.killeffect.ender:
    description: Schaltet den Ender-Kill-Effect frei.
    default: false
  skykings.admin.map:
    description: Darf Map-Gameplay, Spawn, Zonen, Secrets, Routen, Landmarks, Displays und Map-Import einrichten.
    default: false
  skykings.admin.event:
    description: Darf Serverevents wie /verlosung starten und stoppen.
    default: false
