name: SkyKings-Admin
version: ${project.version}
main: net.skykings.admin.SkyKingsAdmin
depend: [SkyKings-Core, SkyKings-Combat, SkyKings-Crates]
description: >
  Admin-Modul für Staff-Commands, Warps, Audit, Events, Casino, Diagnose und Discord-Logging.
authors: [SkyKings Team]
commands:
  rang:
    description: Setzt den SkyKings-Rang eines Online-Spielers.
    usage: /rang <Spieler> <Rang>
  rechte:
    description: Vergibt ein freigegebenes Gutschein-Recht.
    usage: /rechte <Spieler> <Recht>
  announcement:
    description: Sendet eine formatierte SkyKings-Ankündigung.
    usage: /announcement <Nachricht>
    aliases: [announce]
  clearchat:
    description: Leert den Chat für alle Online-Spieler.
    usage: /clearchat
    aliases: [cc]
  clear:
    description: Startet einen angekündigten Boden-Clear mit 2 Minuten Countdown.
    usage: /clear
    aliases: [groundclear, bodenclear]
  warp:
    description: Öffnet die SkyKings-Warp-Auswahl oder startet eine 3-Sekunden-Schnellreise.
    usage: /warp [Name]
    aliases: [warps]
  setwarp:
    description: Setzt einen Warp an der aktuellen Position.
    usage: /setwarp <Name>
    permission: skykings.admin.warps
  delwarp:
    description: Löscht einen Warp.
    usage: /delwarp <Name>
    aliases: [deletewarp]
    permission: skykings.admin.warps
  maptp:
    description: Staff-Schnellreise zu den offiziellen SkyKings-Welten.
    usage: /maptp <main|plots|islands|community>
    permission: skykings.admin.maptp
  freitag:
    description: Startet den grossen SkyKings-Freitags-Community-Abend.
    usage: /freitag [status|stop]
    permission: skykings.admin.friday
  verlosen:
    description: Verlost im Freitags-Event den gehaltenen Item-Stack oder beendet die Phase.
    usage: /verlosen [fertig]
    permission: skykings.admin.friday
  casino:
    description: Öffnet das Void Crown Casino für Coins und SkyKings Sterne.
    usage: /casino
    aliases: [voidcrown]
  skcheck:
    description: Prüft Plugins, Services und Kernwelten nach einem Deploy.
    usage: /skcheck
    aliases: [systemcheck, skycheck]
  discordtest:
    description: Testet die ausgehende Discord-Bot-Verbindung.
    usage: /discordtest [staff|audit|events|status]
    permission: skykings.admin.discord
permissions:
  skykings.admin.rang:
    description: Darf /rang verwenden.
    default: false
  skykings.admin.rechte:
    description: Darf /rechte verwenden.
    default: false
  skykings.admin.systemcheck:
    description: Darf den SkyKings Runtime-Systemcheck ausführen.
    default: false
  skykings.admin.discord:
    description: Darf die Discord-Bridge testen und verwalten.
    default: false
  skykings.admin.warps:
    description: Darf Warps setzen und löschen.
    default: false
  skykings.admin.maptp:
    description: Darf technische SkyKings-Welten direkt ansteuern.
    default: false
  skykings.admin.friday:
    description: Darf das Freitags-Event starten, verwalten und Hand-Items verlosen.
    default: false
  skykings.staff.announcement:
    description: Darf Server-Ankündigungen senden.
    default: false
  skykings.staff.clearchat:
    description: Darf den Serverchat leeren.
    default: false
  skykings.staff.clear:
    description: Darf einen manuellen Boden-Clear starten.
    default: false
