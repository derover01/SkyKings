name: SkyKings-Crates
version: ${project.version}
main: net.skykings.crates.SkyKingsCrates
depend: [SkyKings-Core]
description: >
  Crates-Modul (Head-Crates, Preview/Open-GUI, Open-All, Gutscheine, Anti-Dupe, Logs).
authors: [SkyKings Team]
commands:
  crate:
    description: Admin-Verwaltung und Ausgabe von Crates.
    usage: /crate give <Spieler> <Typ> [Anzahl]
  craterewards:
    description: Oeffnet die Paid-Rank-Crate-Rewards.
    usage: /craterewards
permissions:
  skykings.admin.crate:
    description: Darf Crates administrativ ausgeben.
    default: op
